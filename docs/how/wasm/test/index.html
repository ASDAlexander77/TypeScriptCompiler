<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>tslang wasm tests</title>
</head>

<body>
    <pre id="log"></pre>
    <script type="module">
        // Runs every .wasm in ./wasm (a server's directory listing of it) with the host Node's
        // run.mjs uses (host.mjs), and logs each program's output. Serve this folder over HTTP, e.g.
        //   npx http-server .
        // A wasm64 program needs a browser with memory64 (Chrome 133+, Firefox 134+).
        import { createHost, ExitSignal, UncaughtThrow } from "./host.mjs";

        const log = document.getElementById("log");
        const print = (text) => { log.textContent += text; console.log(text); };

        const paths = [];
        const listing = await (await fetch("./wasm")).text();
        const regex = /"([\w.-]+\.wasm)"/g;
        let found;
        while ((found = regex.exec(listing)) !== null) paths.push("./wasm/" + found[1]);

        for (const path of [...new Set(paths)])
        {
            let output = "";
            const host = createHost({ args: [path], write: (fd, text) => { output += text; } });
            let status;
            try
            {
                const { instance } = await WebAssembly.instantiateStreaming(fetch(path), host.imports);
                status = `exit code ${host.run(instance)}`;
            }
            catch (e)
            {
                status = e instanceof UncaughtThrow ? "uncaught exception" : `ERROR ${e}`;
            }

            const ok = status === "exit code 0" && output.includes("done.");
            print(`${ok ? "PASS" : "FAIL"} ${path}: ${status}\n${ok ? "" : output}`);
        }

        print("<<END>>\n");
    </script>
</body>

</html>
